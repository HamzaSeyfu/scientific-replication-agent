[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-replication-agent"
version = "0.1.0"
description = "Evidence-first autonomous scientific replication prototype for Nebius x NVIDIA"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
replicate-agent = "replicator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
